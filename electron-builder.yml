appId: com.example.atlas-photo
productName: Atlas Photo
directories:
  output: release
  buildResources: build
files:
  - dist-electron/**/*
  - public/**/*
asarUnpack:
  - node_modules/@img/sharp-libvips-*/**
win:
  target:
    - nsis
    - portable
  icon: public/icons/logo.png
mac:
  target:
    - dmg
    - zip
  icon: resources/icons/icon.icns
  category: public.app-category.photography
linux:
  target:
    - AppImage
    - deb
  icon: public/icons/logo.png
  category: Photography
  maintainer: Atlas Photo <hello@atlas-photo.app>
  syncDesktopName: true
